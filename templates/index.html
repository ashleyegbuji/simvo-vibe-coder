<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Species Catalog 🐾</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to bottom right, #f7c1d3, #ffd6e0);
    display: flex;
    justify-content: center;
    padding: 50px 0;
    margin: 0;
}
.container {
    text-align: center;
    background: white;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    width: 95%;
    max-width: 900px;
}
h1, h2 { color: #b83280; }
h2 { margin-bottom: 20px; }
input[type="text"] {
    padding: 15px;
    width: 85%;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-top: 10px;
    background-color: #ffe0eb;
    font-size: 16px;
}
button {
    padding: 12px 25px;
    background-color: #b83280;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
}
button:hover { background-color: #e754b7; }
#loading {
    display: none;
    font-weight: bold;
    margin: 15px 0;
    color: #b83280;
}
.species-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    margin: 15px 0;
    text-align: center;
    background-color: #fff0f5;
}
.species-card h4 { margin: 10px 0 5px; }
.species-card p { font-size: 14px; margin: 5px 0; }
.carousel {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding: 10px 0;
}
.carousel img {
    max-width: 150px;
    border-radius: 5px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
}
.carousel img.loaded {
    opacity: 1;
}
.carousel::-webkit-scrollbar {
    height: 6px;
}
.carousel::-webkit-scrollbar-thumb {
    background-color: #b83280;
    border-radius: 3px;
}
</style>
</head>
<body>
<div class="container">
    <h1>Species Catalog 🐾</h1>
    <h2>Find Info About Any Animal</h2>
    <form id="speciesForm">
        <input type="text" name="name" placeholder="Enter animal name" required>
        <br>
        <button type="submit">Search</button>
    </form>
    <div id="loading">🔄 Loading species data...</div>
    <div id="result"></div>
</div>

<script>
// Progressive image loader
function loadImageAsync(img, url) {
    const temp = new Image();
    temp.src = url;
    temp.onload = () => {
        img.src = url;
        img.classList.add('loaded');
    };
}

async function runSearch(e) {
    if (e && e.preventDefault) e.preventDefault();

    const query = document.querySelector("input[name='name']").value.trim();
    if (!query) return;

    const loadingEl = document.getElementById("loading");
    const resultsContainer = document.getElementById("result");
    loadingEl.style.display = "block";
    resultsContainer.innerHTML = "";

    try {
        const res = await fetch(`/species?name=${encodeURIComponent(query)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        const items = Array.isArray(data.data) ? data.data : [];
        if (!items.length) {
            resultsContainer.innerHTML = "<div>No results found.</div>";
            return;
        }

        for (const animal of items) {
            const card = document.createElement("div");
            card.className = "species-card";

            const title = document.createElement("h4");
            title.textContent = animal.vernacularName || animal.scientificName || "Unknown";
            card.appendChild(title);

            const info = document.createElement("p");
            info.innerHTML = `
                Scientific: ${animal.scientificName || "-"}<br>
                Kingdom: ${animal.kingdom || "-"}<br>
                Habitats: ${(animal.habitats || []).join(", ") || "-"}<br>
                Threat: ${(animal.threatStatuses || []).join(", ") || "-"}<br>
                Extinct: ${animal.extinct ? "Yes" : "No"}
            `;
            card.appendChild(info);

            const imgs = Array.isArray(animal.images) ? animal.images.filter(Boolean) : [];
            if (imgs.length) {
                const carousel = document.createElement("div");
                carousel.className = "carousel";
                imgs.forEach(url => {
                    const img = document.createElement("img");
                    carousel.appendChild(img);
                    // Load images progressively
                    loadImageAsync(img, url);
                });
                card.appendChild(carousel);
            }

            resultsContainer.appendChild(card);
        }

    } catch (err) {
        console.error(err);
        resultsContainer.innerHTML = `<div>Error: ${err.message}</div>`;
    } finally {
        loadingEl.style.display = "none";
    }
}

document.getElementById("speciesForm").addEventListener("submit", runSearch);
</script>
</body>
</html>
