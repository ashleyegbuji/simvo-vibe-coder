<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Species Catalog 🐾</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(to bottom right, #f7c1d3, #ffd6e0);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding-top: 50px;
}
.container {
    text-align: center;
    background: white;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    width: 95%;
    max-width: 900px;
}
h1 {
    color: #b83280;
    margin-bottom: 10px;
}
h2 {
    color: #b83280;
    margin-bottom: 20px;
}
input[type="text"] {
    padding: 12px;
    width: 80%;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-top: 10px;
    background-color: #ffe0eb;
}
button {
    padding: 12px 25px;
    background-color: #b83280;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
}
button:hover { background-color: #e754b7; }
#loading { font-weight: bold; margin-top: 15px; color: #b83280; }
.species-card {
    text-align: left;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    margin-top: 20px;
}
.species-card img {
    max-width: 200px;
    margin: 5px;
    border-radius: 5px;
}
.carousel {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
}
</style>
</head>
<body>
<div class="container">
    <h1>Species Catalog 🐾</h1>
    <h2>Find Info About Any Animal</h2>
    <form id="speciesForm">
        <input type="text" name="name" placeholder="Enter animal name" required>
        <br>
        <button type="submit">Search</button>
    </form>
    <div id="loading" style="display:none;">Loading...</div>
    <div id="result"></div>
</div>

<script>
const form = document.getElementById("speciesForm");
const resultDiv = document.getElementById("result");
const loadingDiv = document.getElementById("loading");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    resultDiv.innerHTML = "";
    loadingDiv.style.display = "block";

    const speciesName = document.querySelector('input[name="name"]').value;

    try {
        const response = await fetch(`/species?name=${encodeURIComponent(speciesName)}`);
        const data = await response.json();
        loadingDiv.style.display = "none";

        if(data.error){
            resultDiv.innerHTML = `<p style="color:red;"><b>${data.error}</b></p>`;
            return;
        }

        data.groups.forEach(group => {
            const familyCard = document.createElement("div");
            familyCard.className = "species-card";
            let html = `<h3>Family: ${group.family}</h3>`;

            group.species.forEach(species => {
                let imgs = species.image_urls.map(url => `<img src="${url}">`).join("");
                html += `
                    <b>${species.scientific_name}</b> - ${species.vernacular_name}<br>
                    Kingdom: ${species.kingdom} | Authorship: ${species.authorship} | Extinct: ${species.extinct ? "Yes" : "No"}<br>
                    <div class="carousel">${imgs}</div><br>
                `;
            });

            familyCard.innerHTML = html;
            resultDiv.appendChild(familyCard);
        });

    } catch(err) {
        loadingDiv.style.display = "none";
        console.error("Fetch Error:", err);
        resultDiv.innerHTML = `<p style="color:red;"><b>API Error. See console.</b></p>`;
    }
});
</script>
</body>
</html>
